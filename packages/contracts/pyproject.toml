[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intraday-contracts"
version = "2.0.0"
description = "Shared contracts for the intraday trading AI services. The only thing services import from each other."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/intraday_contracts"]

[tool.ruff]
line-length = 100
target-version = "py311"
