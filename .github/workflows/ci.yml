name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/contracts[dev]"
          pip install -e "services/market-data[dev]"
          pip install -e "services/intelligence[dev]"
          pip install -e "services/gateway[dev]"
          pip install -e "services/worker[dev]"
          pip install ruff

      # Three lines that catch the entire undeclared-dependency class. A shared
      # virtualenv makes every service's dependency list look correct right up
      # until the container starts and raises ModuleNotFoundError at import.
      - name: Every service imports
        run: |
          for m in intraday_contracts market_data intelligence gateway worker; do
            python -c "import $m" && echo "ok   $m" || { echo "FAIL $m"; exit 1; }
          done

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Tests
        run: pytest -m "not network"

      # Any number a human types into a README drifts from reality, and passing
      # tests do not catch it because tests assert code behaviour, not
      # documentation truth. The README advertises a test count, so the build
      # fails when that count is wrong.
      - name: README test count is accurate
        run: |
          # `-p no:cacheprovider` and an explicit `-v` override the repo's
          # `addopts = -q`, which prints per-file counts instead of the summary
          # line this parses.
          ACTUAL=$(pytest -m "not network" --collect-only -v 2>&1 \
                   | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          # Match `tests-<n>` only. Matching the whole `tests-260%20passing`
          # and then grepping for digits also captures the 20 from `%20`.
          CLAIMED=$(grep -oE 'tests-[0-9]+' README.md | grep -oE '[0-9]+')
          echo "README claims $CLAIMED, suite collects $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::could not parse a collected count — this guard is broken, fix it"
            exit 1
          fi
          if [ "$ACTUAL" != "$CLAIMED" ]; then
            echo "::error::README badge says $CLAIMED tests but the suite has $ACTUAL."
            echo "Update the badge in README.md."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx nuxt build
