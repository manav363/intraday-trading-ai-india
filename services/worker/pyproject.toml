[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "2.0.0"
description = "Scheduled jobs: append-only ingest, retraining, drift detection."
requires-python = ">=3.11"

dependencies = [
    "intraday-contracts",
    "market-data",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.hatch.metadata]
allow-direct-references = true
