[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway"
version = "2.0.0"
description = "The only public API. Composition, narrative templating, chart payloads."
requires-python = ">=3.11"

# pandas is listed because this service imports it. A shared dev venv makes
# every service's dependency list look correct right up until the container
# starts and raises ModuleNotFoundError at import.
dependencies = [
    "intraday-contracts",
    "intelligence",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.hatch.metadata]
allow-direct-references = true
