[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligence"
version = "2.0.0"
description = "Panel, labelling, features, models, calibration, validation, backtest."
requires-python = ">=3.11"

dependencies = [
    "intraday-contracts",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Boosters are optional so the service starts without them; the ensemble
# reports which learners it actually has rather than silently shrinking.
boost = ["lightgbm>=4.3", "xgboost>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[tool.hatch.metadata]
allow-direct-references = true
